<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FitPulse - Tu pulso diario de bienestar">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitPulse</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding-bottom: 0; }
    .login-wrap {
      min-height: 100vh;
      display: flex; flex-direction: column;
      justify-content: flex-end;
      padding: 74px 24px 44px;
      position: relative;
      overflow: hidden;
    }
    .login-wrap::before {
      content: ''; position: absolute;
      width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,.4), transparent 68%);
      top: -140px; right: -120px; pointer-events: none;
    }
    .login-wrap::after {
      content: ''; position: absolute;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(200,255,77,.14), transparent 68%);
      bottom: -160px; left: -140px; pointer-events: none;
    }
    .login-content { position: relative; z-index: 1; }
    .login-logo { width: 60px; height: 60px; border-radius: 18px; display: block; margin-bottom: 26px; }
    .login-title { font-size: 60px; line-height: .9; margin: 0; }
    .login-title .dot { color: var(--lime); }
    .login-sub { margin: 16px 0 34px; font-size: 17px; line-height: 1.45; color: var(--text-secondary); max-width: 30ch; }
    .login-btn { width: 100%; height: 58px; border-radius: 16px; border: none; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; }
    .login-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .email-form { display: none; margin-bottom: 10px; }
    .email-form.active { display: block; }
    .email-form input {
      width: 100%; height: 50px; padding: 0 14px; margin-bottom: 10px;
      border: 1px solid var(--border-strong); border-radius: 14px;
      background: var(--bg-input); color: var(--text-primary);
      font-family: inherit; font-size: 15px; outline: none;
    }
    .email-form input:focus { border-color: var(--lime); }
    .email-form-actions { display: flex; gap: 8px; }
    .email-form-actions button { flex: 1; height: 46px; border-radius: 14px; border: none; cursor: pointer; font-weight: 700; font-size: 14px; }
    #login-error {
      background: rgba(255,69,58,.12); border: 1px solid rgba(255,69,58,.3);
      border-radius: 12px; color: #FF7A70; padding: 12px; font-size: 0.85rem;
      font-weight: 600; margin-bottom: 14px; display: none;
    }
    .login-footer { margin: 20px 0 0; font-size: 12px; line-height: 1.5; color: var(--text-dim); text-align: center; }
  </style>
</head>

<body>
  <div class="login-wrap">
    <div class="login-content">
      <img src="icon-192.png" alt="FitPulse" class="login-logo">
      <h1 class="login-title">Cada serie<br>cuenta<span class="dot">.</span></h1>
      <p class="login-sub">Entrenamiento, nutrición y progreso en un solo sitio. Sin ruido.</p>

      <div id="login-error"></div>

      <button class="login-btn btn-lime glow" id="btn-google">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#08080A"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#08080A" opacity=".75"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#08080A" opacity=".6"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#08080A" opacity=".9"/></svg>
        Continuar con Google
      </button>

      <button class="login-btn btn-ghost-outline" id="btn-toggle-email">Entrar con correo</button>

      <div class="email-form" id="email-form">
        <input type="email" id="email-input" placeholder="Correo electrónico" autocomplete="email">
        <input type="password" id="password-input" placeholder="Contraseña" autocomplete="current-password">
        <div class="email-form-actions">
          <button class="btn-ghost-outline" id="btn-email-login" style="border:1px solid var(--border-strong);border-radius:14px;color:var(--text-primary);">Entrar</button>
          <button class="btn-lime" id="btn-email-register" style="border-radius:14px;">Crear cuenta</button>
        </div>
      </div>

      <button class="login-btn btn-ghost" id="btn-start">Probar sin cuenta</button>

      <p class="login-footer">
        Al continuar aceptas la <a href="privacy.html">política de privacidad</a>.<br>
        <a href="#" id="btn-offline" style="color:var(--text-dim);text-decoration:underline;">Solo quiero explorar la app (demo)</a>
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.469.0/umd/lucide.min.js" defer></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
        return;
      }

      const errEl = document.getElementById('login-error');
      const showErr = (msg) => { errEl.textContent = msg; errEl.style.display = 'block'; };

      document.getElementById('btn-google').addEventListener('click', async () => {
        errEl.style.display = 'none';
        const res = await Auth.loginWithGoogle();
        if (res === 'onboarding') window.location.href = 'onboarding.html';
        else if (res === 'dashboard') window.location.href = 'index.html';
        else if (res) showErr('Error al iniciar sesión. Intenta de nuevo.');
      });

      document.getElementById('btn-toggle-email').addEventListener('click', () => {
        document.getElementById('email-form').classList.toggle('active');
      });

      document.getElementById('btn-email-login').addEventListener('click', async () => {
        errEl.style.display = 'none';
        const email = document.getElementById('email-input').value.trim();
        const pass = document.getElementById('password-input').value;
        if (!email || !pass) { showErr('Ingresa correo y contraseña.'); return; }
        const res = await Auth.loginWithEmail(email, pass);
        if (res === 'onboarding') window.location.href = 'onboarding.html';
        else if (res === 'dashboard') window.location.href = 'index.html';
      });

      document.getElementById('btn-email-register').addEventListener('click', async () => {
        errEl.style.display = 'none';
        const email = document.getElementById('email-input').value.trim();
        const pass = document.getElementById('password-input').value;
        if (!email || !pass) { showErr('Ingresa correo y contraseña.'); return; }
        const res = await Auth.registerWithEmail(email, pass);
        if (res === 'onboarding') window.location.href = 'onboarding.html';
      });

      document.getElementById('btn-start').addEventListener('click', () => {
        localStorage.setItem('fitpulse_offline', 'true');
        localStorage.removeItem('fitpulse_demo');
        const config = Storage.obtenerConfig();
        if (!config.nombre || config.nombre === 'Usuario') {
          window.location.href = 'onboarding.html';
        } else {
          window.location.href = 'index.html';
        }
      });

      document.getElementById('btn-offline').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.setItem('fitpulse_offline', 'true');
        localStorage.setItem('fitpulse_demo', 'true');
        window.location.href = 'index.html';
      });
    });
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => { }); }
  </script>
</body>

</html>
