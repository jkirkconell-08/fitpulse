<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FitPulse - Entreno">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23C8FF4D'/><text x='32' y='44' font-size='26' text-anchor='middle' fill='%2308080A' font-family='Arial' font-weight='bold'>FP</text></svg>">
  <title>FitPulse - Entreno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="logo"><div class="logo-icon"><img src="icon-192.png" alt="FitPulse"></div><span class="logo-text">FitPulse</span></a>
    <div class="header-actions">
      <a href="perfil.html" id="user-avatar" class="user-avatar"></a>
    </div>
  </header>
  <main class="container">
    <h1 class="page-title" style="font-family:var(--font-display);">Entreno</h1>

    <div class="tabs">
      <button class="tab-pill" data-tab="fuerza">FUERZA</button>
      <button class="tab-pill" data-tab="cardio">CARDIO</button>
      <button class="tab-pill" data-tab="historial">HISTORIAL</button>
    </div>

    <div class="tab-pane" id="tab-fuerza">
      <div id="routines-container"></div>
    </div>
    <div class="tab-pane" id="tab-cardio">
      <div id="cardio-container"></div>
    </div>
    <div class="tab-pane" id="tab-historial">
      <div id="historial-sessions-container"></div>
    </div>
  </main>
  <div id="routine-overlay" class="overlay"></div>
  <div id="exercise-overlay" class="overlay"></div>

  <div class="bottom-nav-scrim"></div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i data-lucide="flame" style="width:21px;height:21px"></i><span>HOY</span></a>
    <a href="ejercicios.html" class="nav-item active"><i data-lucide="dumbbell" style="width:21px;height:21px"></i><span>ENTRENO</span></a>
    <div class="nav-fab-wrap"><button class="nav-fab" id="nav-fab">+</button></div>
    <a href="progreso.html" class="nav-item"><i data-lucide="trending-up" style="width:21px;height:21px"></i><span>PROGRESO</span></a>
    <a href="comidas.html" class="nav-item"><i data-lucide="utensils" style="width:21px;height:21px"></i><span>COMIDAS</span></a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.469.0/umd/lucide.min.js" defer></script>
  <script src="js/icons.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/app.js"></script>
  <script src="js/routines.js"></script>
  <script src="js/cardio.js"></script>
  <script src="js/quick-add.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      const ok = await Auth.requireAuth();
      if (!ok) return;
      Auth._updateUI();
      Routines.init();
      Cardio.init();
      Routines.renderHistorial();
      Tabs.init('.tab-pill', 'tab-', 'fuerza');
      Icons.init(document.body);
      QuickAdd.init();
    });
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  </script>
</body>
</html>
