<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FitPulse - Progreso">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23C8FF4D'/><text x='32' y='44' font-size='26' text-anchor='middle' fill='%2308080A' font-family='Arial' font-weight='bold'>FP</text></svg>">
  <title>FitPulse - Progreso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="container">
    <div class="page-top-row">
      <h1 class="page-title" style="margin:0;font-family:var(--font-display);">Progreso</h1>
      <div class="page-top-actions">
        <a href="perfil.html" id="user-avatar" class="user-avatar"></a>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-pill" data-tab="peso">PESO</button>
      <button class="tab-pill" data-tab="medidas">MEDIDAS</button>
      <button class="tab-pill" data-tab="semana">SEMANA</button>
    </div>

    <div class="tab-pane" id="tab-peso">
      <div id="peso-tab-container"></div>
    </div>
    <div class="tab-pane" id="tab-medidas">
      <div id="medidas-foto-container"></div>
      <div id="medidas-container"></div>
    </div>
    <div class="tab-pane" id="tab-semana">
      <div id="semana-resumen-container"></div>
      <div id="historial-container"></div>
    </div>
  </main>
  <div id="edit-overlay" class="overlay"></div>
  <div id="nota-overlay" class="overlay"></div>

  <div class="bottom-nav-scrim"></div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i data-lucide="flame" style="width:21px;height:21px"></i><span>HOY</span></a>
    <a href="ejercicios.html" class="nav-item"><i data-lucide="dumbbell" style="width:21px;height:21px"></i><span>ENTRENO</span></a>
    <div class="nav-fab-wrap"><button class="nav-fab" id="nav-fab">+</button></div>
    <a href="progreso.html" class="nav-item active"><i data-lucide="trending-up" style="width:21px;height:21px"></i><span>PROGRESO</span></a>
    <a href="comidas.html" class="nav-item"><i data-lucide="utensils" style="width:21px;height:21px"></i><span>COMIDAS</span></a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.469.0/umd/lucide.min.js" defer></script>
  <script src="js/icons.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/photo-store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/app.js"></script>
  <script src="js/medidas.js"></script>
  <script src="js/progreso.js"></script>
  <script src="js/quick-add.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      const ok = await Auth.requireAuth();
      if (!ok) return;
      Auth._updateUI();
      ProgresoPage.init();
      Tabs.init('.tab-pill', 'tab-', 'peso');
      Icons.init(document.body);
      QuickAdd.init();
    });
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  </script>
</body>
</html>
