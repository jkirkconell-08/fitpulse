<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FitPulse - Hoy">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitPulse - Hoy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23C8FF4D'/><text x='32' y='44' font-size='26' text-anchor='middle' fill='%2308080A' font-family='Arial' font-weight='bold'>FP</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="notif-banner" class="notif-banner" onclick="Notificaciones.solicitarPermiso()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <span>Activa las notificaciones para no olvidar tu plan</span>
  </div>
  <main class="container">
    <div class="page-top-row">
      <div id="fecha-display"></div>
      <div class="page-top-actions">
        <button class="header-icon-btn" id="btn-notif-bell" title="Notificaciones"><i data-lucide="bell" style="width:18px;height:18px;"></i><span class="dot"></span></button>
        <a href="perfil.html" id="user-avatar" class="user-avatar"></a>
      </div>
    </div>
    <div class="hero-card" id="hero-ring-container"></div>
    <div id="today-workout-container"></div>
    <div id="water-widget" class="water-widget"></div>
    <div id="checklist-container"></div>
    <div id="nota-container" class="nota-section"></div>
  </main>

  <!-- Modal de edición de hábitos (repurpose de .overlay) -->
  <div id="nota-overlay" class="overlay"></div>

  <!-- Bottom sheet de Cierre del día (no bloqueante) -->
  <div id="cierre-backdrop" class="sheet-backdrop"></div>

  <div class="bottom-nav-scrim"></div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><i data-lucide="flame" style="width:21px;height:21px"></i><span>HOY</span></a>
    <a href="ejercicios.html" class="nav-item"><i data-lucide="dumbbell" style="width:21px;height:21px"></i><span>ENTRENO</span></a>
    <div class="nav-fab-wrap"><button class="nav-fab" id="nav-fab">+</button></div>
    <a href="progreso.html" class="nav-item"><i data-lucide="trending-up" style="width:21px;height:21px"></i><span>PROGRESO</span></a>
    <a href="comidas.html" class="nav-item"><i data-lucide="utensils" style="width:21px;height:21px"></i><span>COMIDAS</span></a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.469.0/umd/lucide.min.js" defer></script>
  <script src="js/icons.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/routines.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quick-add.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      const ok = await Auth.requireAuth();
      if (!ok) return;
      App.init();
      CloudSync.scheduleSync();
      Icons.init(document.body);
      QuickAdd.init();
      document.getElementById('btn-notif-bell').addEventListener('click', () => Notificaciones.solicitarPermiso());
    });
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
  </script>
</body>
</html>
