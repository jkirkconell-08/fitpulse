<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="FitPulse - Comidas">
  <meta name="theme-color" content="#08080A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23C8FF4D'/><text x='32' y='44' font-size='26' text-anchor='middle' fill='%2308080A' font-family='Arial' font-weight='bold'>FP</text></svg>">
  <title>FitPulse - Comidas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="container">
    <div class="page-top-row">
      <h1 class="page-title" style="margin:0;font-family:var(--font-display);">Comidas</h1>
      <div class="page-top-actions">
        <button class="header-icon-btn" id="btn-historial-comidas" title="Historial de comidas"><i data-lucide="clock" style="width:18px;height:18px;"></i></button>
        <a href="perfil.html" id="user-avatar" class="user-avatar"></a>
      </div>
    </div>
    <div id="comidas-container"></div>
  </main>
  <div id="food-overlay" class="overlay"><div class="overlay-content food-sheet" style="text-align:left;"><div class="food-sheet-head"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2 style="font-size:1.1rem;"><i data-lucide="search" style="width:18px;height:18px;margin-right:6px;vertical-align:middle;"></i>Buscar alimento</h2><button id="food-overlay-close" style="background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;"><i data-lucide="x" class="icon icon-md" style="width:18px;height:18px;"></i></button></div><input type="search" id="food-search-input" class="food-search-input" placeholder="Buscar alimento..." autocomplete="off"><div id="food-cat-btns" class="food-cat-btns"></div></div><div id="food-search-results" class="food-search-results food-sheet-scroll"></div><div id="food-cart-bar" class="food-sheet-foot"></div></div></div>
  <div id="food-add-modal" class="overlay"></div>

  <div class="bottom-nav-scrim"></div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i data-lucide="flame" style="width:21px;height:21px"></i><span>HOY</span></a>
    <a href="ejercicios.html" class="nav-item"><i data-lucide="dumbbell" style="width:21px;height:21px"></i><span>ENTRENO</span></a>
    <div class="nav-fab-wrap"><button class="nav-fab" id="nav-fab">+</button></div>
    <a href="progreso.html" class="nav-item"><i data-lucide="trending-up" style="width:21px;height:21px"></i><span>PROGRESO</span></a>
    <a href="comidas.html" class="nav-item active"><i data-lucide="utensils" style="width:21px;height:21px"></i><span>COMIDAS</span></a>
  </nav>

  <script src="js/lucide.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/firebase-config.js"></script><script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/cloud-sync.js"></script><script src="js/notifications.js"></script><script src="js/comidas.js"></script><script src="js/app.js"></script>
  <script src="js/quick-add.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();
      const ok = await Auth.requireAuth();
      if (!ok) return;
      Auth._updateUI();
      Comidas.init();
      Icons.init(document.body);
      QuickAdd.init();
      Notificaciones.init();
    });
  </script>
  <script src="js/sw-client.js"></script>
</body>
</html>
